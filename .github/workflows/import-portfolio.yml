name: Import approved portfolio rebuild
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download checked source archives
        run: |
          curl --fail --location --output /tmp/part1.zip https://github.com/ZeinabAbouTwyla/zaynab-portfolio/releases/download/portfolio-rebuild-assets/portfolio-part-1.zip
          curl --fail --location --output /tmp/part2.zip https://github.com/ZeinabAbouTwyla/zaynab-portfolio/releases/download/portfolio-rebuild-assets/portfolio-part-2.zip
          curl --fail --location --output /tmp/part3.zip https://github.com/ZeinabAbouTwyla/zaynab-portfolio/releases/download/portfolio-rebuild-assets/rebuild-assets-3.zip
          curl --fail --location --output /tmp/part4.zip https://github.com/ZeinabAbouTwyla/zaynab-portfolio/releases/download/portfolio-rebuild-assets/rebuild-assets-4.zip
          echo '30802438fde6a91f1af11d389146fac76c355435806310f49f11634204d11d80  /tmp/part1.zip' | sha256sum --check
          echo '67176d8b3fc7cdf0efdc80690eecff9297a314e968eba8efbb94eafdff64796f  /tmp/part2.zip' | sha256sum --check
          echo '76f910926212fbcdc9a1dac4c4aaf81a385f989548074efe18660ee8a276521d  /tmp/part3.zip' | sha256sum --check
          echo '316138e4dcbc18d94a066346589d61355b0a2c8255d08171a4d7730951117549  /tmp/part4.zip' | sha256sum --check
      - name: Import only static portfolio files
        shell: python
        run: |
          import zipfile, pathlib
          for n in range(1,5):
              with zipfile.ZipFile(f'/tmp/part{n}.zip') as z:
                  for f in z.infolist():
                      p=pathlib.PurePosixPath(f.filename)
                      assert not p.is_absolute() and '..' not in p.parts
                      assert (len(p.parts)==1 and p.suffix in ('.html','.js','.css')) or (p.parts[0]=='assets' and p.suffix in ('.png','.jpg','.jpeg','.pdf'))
                  z.extractall('.')
      - name: Commit portfolio and remove temporary importer
        run: |
          rm .github/workflows/import-portfolio.yml
          git config user.name 'ZeinabAbouTwyla'
          git config user.email 'ZeinabAbouTwyla@users.noreply.github.com'
          git add --all
          git commit -m 'Rebuild portfolio with approved artwork and project case studies'
          git push origin HEAD:main
