name: Bundle portfolio typography
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Store the selected open fonts with the site
        shell: python
        run: |
          import pathlib, urllib.request, re
          fonts=[['Alexandria', '300', 'https://fonts.gstatic.com/s/alexandria/v6/UMBCrPdDqW66y0Y2usFeQCH18mulUxBvI9qlTqbH.ttf'], ['Alexandria', '400', 'https://fonts.gstatic.com/s/alexandria/v6/UMBCrPdDqW66y0Y2usFeQCH18mulUxBvI9r7TqbH.ttf'], ['Alexandria', '500', 'https://fonts.gstatic.com/s/alexandria/v6/UMBCrPdDqW66y0Y2usFeQCH18mulUxBvI9rJTqbH.ttf'], ['Alexandria', '600', 'https://fonts.gstatic.com/s/alexandria/v6/UMBCrPdDqW66y0Y2usFeQCH18mulUxBvI9olSabH.ttf'], ['Alexandria', '700', 'https://fonts.gstatic.com/s/alexandria/v6/UMBCrPdDqW66y0Y2usFeQCH18mulUxBvI9ocSabH.ttf'], ['Alexandria', '800', 'https://fonts.gstatic.com/s/alexandria/v6/UMBCrPdDqW66y0Y2usFeQCH18mulUxBvI9p7SabH.ttf'], ['Alexandria', '900', 'https://fonts.gstatic.com/s/alexandria/v6/UMBCrPdDqW66y0Y2usFeQCH18mulUxBvI9pSSabH.ttf'], ['Space Grotesk', '400', 'https://fonts.gstatic.com/s/spacegrotesk/v22/V8mQoQDjQSkFtoMM3T6r8E7mF71Q-gOoraIAEj7oUUsj.ttf'], ['Space Grotesk', '500', 'https://fonts.gstatic.com/s/spacegrotesk/v22/V8mQoQDjQSkFtoMM3T6r8E7mF71Q-gOoraIAEj7aUUsj.ttf'], ['Space Grotesk', '600', 'https://fonts.gstatic.com/s/spacegrotesk/v22/V8mQoQDjQSkFtoMM3T6r8E7mF71Q-gOoraIAEj42Vksj.ttf'], ['Space Grotesk', '700', 'https://fonts.gstatic.com/s/spacegrotesk/v22/V8mQoQDjQSkFtoMM3T6r8E7mF71Q-gOoraIAEj4PVksj.ttf']]
          css=[]
          for family,weight,url in fonts:
              name=family.replace(' ','')+'-'+weight+'.ttf'
              urllib.request.urlretrieve(url,'assets/'+name)
              css.append("@font-face{font-family:'"+family+"';font-style:normal;font-weight:"+weight+";font-display:swap;src:url('assets/"+name+"') format('truetype')}")
          p=pathlib.Path('style.css');p.write_text('\n'.join(css)+'\n'+p.read_text())
          for p in pathlib.Path('.').glob('*.html'):
              text=re.sub(r'<link rel="preconnect"[^>]*>','',p.read_text())
              text=re.sub(r'<link href="https://fonts.googleapis.com[^>]+>','',text);p.write_text(text)
      - name: Commit local typography
        run: |
          rm .github/workflows/local-fonts.yml
          git config user.name 'ZeinabAbouTwyla'
          git config user.email 'ZeinabAbouTwyla@users.noreply.github.com'
          git add --all
          git commit -m 'Serve Alexandria and Space Grotesk locally'
          git push origin HEAD:main
